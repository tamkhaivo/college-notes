<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparative Interest Rate Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Comparative Interest Rate Calculator</h1>
        <div class="row">
            <div class="col-md-6">
                <h2>Input</h2>
                <form id="interestForm">
                    <div class="mb-3">
                        <label for="principal" class="form-label">Principal Amount ($)</label>
                        <input type="number" class="form-control" id="principal" value="10000" required>
                    </div>
                    <div class="mb-3">
                        <label for="rate" class="form-label">Annual Interest Rate (%)</label>
                        <input type="number" class="form-control" id="rate" value="5" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="years" class="form-label">Investment Duration (Years)</label>
                        <input type="number" class="form-control" id="years" value="10" required>
                    </div>
                    <div class="mb-3">
                        <label for="taxRate" class="form-label">Tax Rate (%)</label>
                        <input type="number" class="form-control" id="taxRate" value="20" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label for="monthlyContribution" class="form-label">Monthly Contribution ($)</label>
                        <input type="number" class="form-control" id="monthlyContribution" value="100" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Calculate</button>
                </form>
            </div>
            <div class="col-md-6">
                <h2>Results</h2>
                <div id="results"></div>
            </div>
        </div>
    </div>

    <script src="interest.js"></script>
</body>
</html>
